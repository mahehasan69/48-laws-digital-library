<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111"><title>The 48 Laws of Power — Reader</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font-family:Arial,sans-serif;touch-action:pan-y}
#reader{position:fixed;inset:0;width:100vw;height:100dvh;background:#111;align-items:center;justify-content:center;overflow:hidden}
#reader[hidden],#loading[hidden]{display:none!important}#reader:not([hidden]){display:flex}
#pageCanvas{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;background:white;box-shadow:0 0 24px #0008}
#bookStage{position:relative;perspective:1800px;transform-style:preserve-3d;max-width:100vw;max-height:100dvh}
#turnSheet{position:absolute;inset:0;z-index:3;pointer-events:none;transform-style:preserve-3d}
#turnSheet.turn-next{transform-origin:left center;animation:turnNext .82s cubic-bezier(.42,0,.22,1) forwards}
#turnSheet.turn-prev{transform-origin:right center;animation:turnPrev .82s cubic-bezier(.42,0,.22,1) forwards}
#turnSheet .page-front,#turnSheet .page-back{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;overflow:hidden}
#turnSheet .page-front img{display:block;width:100%;height:100%;object-fit:fill}
#turnSheet .page-back{transform:rotateY(180deg);background:linear-gradient(90deg,#b9b5ad 0%,#eeeae1 5%,#fffdf6 18%,#f5f1e8 100%);box-shadow:inset -12px 0 18px #0002}
#turnSheet .page-front:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0000 58%,#0003 100%);opacity:0;animation:pageShade .82s ease-in forwards}
#turnSheet.turn-prev .page-front:after{background:linear-gradient(270deg,#0000 58%,#0003 100%)}
@keyframes pageShade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes turnNext{0%{transform:rotateY(0);filter:drop-shadow(0 1px 1px #0002)}45%{filter:drop-shadow(12px 5px 8px #0007)}100%{transform:rotateY(-180deg);filter:drop-shadow(0 0 0 #0000)}}
@keyframes turnPrev{0%{transform:rotateY(0);filter:drop-shadow(0 1px 1px #0002)}45%{filter:drop-shadow(-12px 5px 8px #0007)}100%{transform:rotateY(180deg);filter:drop-shadow(0 0 0 #0000)}}
#bookStage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 16px #0002}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:14px;text-align:center;padding:28px;line-height:1.6}
#counter{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#bbb;background:#111a;padding:5px 9px;border-radius:20px;opacity:.55;pointer-events:none}
#jump{position:fixed;right:12px;bottom:18px;z-index:5;display:flex;gap:6px;align-items:center;background:#222d;padding:7px;border:1px solid #5558;border-radius:12px;backdrop-filter:blur(8px)}
#jump input{display:block;width:65px;background:#111;color:#fff;border:1px solid #666;border-radius:7px;padding:7px;font-size:14px;text-align:center}
#jump button{background:#eee;color:#111;border:0;border-radius:7px;padding:8px 10px;font-weight:600}
</style></head><body>
<div id="loading">Opening your book…</div>
<div id="reader" hidden><div id="bookStage"><canvas id="pageCanvas"></canvas></div></div>
<div id="counter"></div>
<div id="jump"><input id="pageInput" type="number" min="1" placeholder="Page" inputmode="numeric" aria-label="Page number"><button id="goPage" type="button">Go</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const loading=document.getElementById('loading'),reader=document.getElementById('reader'),stage=document.getElementById('bookStage'),canvas=document.getElementById('pageCanvas'),ctx=canvas.getContext('2d'),counter=document.getElementById('counter'),pageInput=document.getElementById('pageInput');
const PROGRESS_KEY='mahe-48laws-last-page';let pdf=null,pageNum=1,rendering=false,pending=false,turning=false;
function showError(message){reader.hidden=true;loading.hidden=false;loading.textContent='Book could not load: '+message+' — refresh the page to try again.'}
function saveProgress(){try{localStorage.setItem(PROGRESS_KEY,String(pageNum))}catch(e){}}
async function drawPage(){
 if(!pdf)return;if(rendering){pending=true;return}rendering=true;pending=false;
 try{const page=await pdf.getPage(pageNum),base=page.getViewport({scale:1}),fit=Math.min(window.innerWidth/base.width,window.innerHeight/base.height),dpr=Math.min(window.devicePixelRatio||1,2),view=page.getViewport({scale:fit}),hi=page.getViewport({scale:fit*dpr});
 canvas.width=Math.round(hi.width);canvas.height=Math.round(hi.height);canvas.style.width=Math.floor(view.width)+'px';canvas.style.height=Math.floor(view.height)+'px';
 await page.render({canvasContext:ctx,viewport:hi}).promise;counter.textContent=pageNum+' / '+pdf.numPages;pageInput.value=pageNum;
 }catch(e){showError(e.message)}finally{rendering=false;if(pending)drawPage()}
}
async function turnPage(direction){
 if(!pdf||turning)return;
 const target=pageNum+(direction==='next'?1:-1);
 if(target<1||target>pdf.numPages)return;
 turning=true;
 let sheet=null;
 try{
  await new Promise(resolve=>requestAnimationFrame(resolve));
  const oldPage=canvas.toDataURL('image/jpeg',0.9);
  pageNum=target;saveProgress();await drawPage();
  sheet=document.createElement('div');sheet.id='turnSheet';
  sheet.className=direction==='next'?'turn-next':'turn-prev';
  const front=document.createElement('div');front.className='page-front';
  const image=document.createElement('img');image.src=oldPage;front.appendChild(image);
  const back=document.createElement('div');back.className='page-back';
  sheet.append(front,back);stage.appendChild(sheet);
  await new Promise(resolve=>sheet.addEventListener('animationend',resolve,{once:true}));
 }catch(e){console.error('Page turn failed',e)}
 finally{if(sheet)sheet.remove();turning=false}
}
function next(){turnPage('next')}
function prev(){turnPage('prev')}
function jumpToPage(){if(!pdf)return;const n=Number(pageInput.value);if(!Number.isInteger(n)||n<1||n>pdf.numPages){pageInput.setCustomValidity('Enter a page from 1 to '+pdf.numPages);pageInput.reportValidity();return}pageInput.setCustomValidity('');pageNum=n;saveProgress();drawPage()}
document.getElementById('goPage').addEventListener('click',jumpToPage);pageInput.addEventListener('keydown',e=>{if(e.key==='Enter')jumpToPage()});
let sx=0,sy=0;reader.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});
reader.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev()}},{passive:true});
reader.addEventListener('click',e=>{const x=e.clientX/window.innerWidth;if(x>.78)next();else if(x<.22)prev()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}});
window.addEventListener('resize',()=>{if(pdf)drawPage()});
(async()=>{try{
 if(!window.pdfjsLib)throw new Error('PDF viewer library did not load. Check your internet connection and refresh.');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 pdf=await pdfjsLib.getDocument({url:'./book.pdf',disableAutoFetch:true,disableStream:true,rangeChunkSize:65536}).promise;
 try{const saved=Number(localStorage.getItem(PROGRESS_KEY));if(Number.isInteger(saved)&&saved>=1&&saved<=pdf.numPages)pageNum=saved}catch(e){}
 reader.hidden=false;loading.hidden=true;await drawPage();
 }catch(e){showError(e.message)}})();
</script></body></html>
